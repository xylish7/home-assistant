esphome:
  name: esp32-c3-interphone
  friendly_name: ESP32-C3 Intercom
  name_add_mac_suffix: false
  on_boot:
    # -------------------------------------------------------------------------
    # Phase 1: Run BEFORE Wi-Fi powers on (Zero RF load, resting voltage)
    # -------------------------------------------------------------------------
    - priority: 600
      then:
        - delay: 30ms # Allow power rail and internal reference to settle
        - repeat:
            count: 15
            then:
              - component.update: batt_voltage
              - delay: 5ms
        - component.update: batt_percentage

    # -------------------------------------------------------------------------
    # Phase 2: Main Logic (Wi-Fi, API handshake, and Door operation)
    # -------------------------------------------------------------------------
    - priority: -100
      then:
        - logger.log:
            format: ">>> Ring detected! Waiting up to 15s for HA connection..."
            tag: "INTERCOM"
            level: INFO
        - wait_until:
            timeout: 15s
            condition:
              api.connected:

        - if:
            condition:
              api.connected:
            then:
              - logger.log:
                  format: ">>> Stable Battery: %.2f V (%.0f%%)"
                  args:
                    [
                      "id(batt_voltage).state",
                      "id(batt_percentage).state",
                    ]
                  tag: "INTERCOM"
                  level: INFO

              - logger.log:
                  format: ">>> HA connected! Ring published, waiting for command..."
                  tag: "INTERCOM"
                  level: INFO
              - binary_sensor.template.publish:
                  id: call_sensor
                  state: ON
              - delay: 15s
              - binary_sensor.template.publish:
                  id: call_sensor
                  state: OFF
              - delay: 500ms
            else:
              - logger.log:
                  format: ">>> Failed to connect to HA in time. Entering sleep."
                  tag: "INTERCOM"
                  level: WARN

        - deep_sleep.enter: sleep_module

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_CDC
  level: DEBUG

api:
  reboot_timeout: 0s
  encryption:
    key: !secret esp32_c3_interphone__encryption_key

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: 5E:E9:31:41:77:35
      manual_ip:
        static_ip: 192.168.0.141
        gateway: 192.168.0.1
        subnet: 255.255.255.0
        dns1: 192.168.0.1
  power_save_mode: none
  fast_connect: true
  output_power: 14.0dBm

deep_sleep:
  id: sleep_module
  wakeup_pin:
    number: GPIO4
    mode:
      input: true
      pullup: true
    inverted: true

output:
  - platform: gpio
    pin: GPIO3
    id: out_hook

  - platform: gpio
    pin: GPIO5
    id: out_unlock

binary_sensor:
  - platform: template
    name: "Intercom Ring"
    id: call_sensor
    device_class: sound

  - platform: template
    name: "Door Unlocked"
    id: door_unlocked_sensor
    device_class: opening

sensor:
  - platform: adc
    pin: GPIO0
    name: "Intercom Battery Voltage"
    id: batt_voltage
    attenuation: 12db
    update_interval: never
    filters:
      # Discards outlier spikes and sags across the 15-sample burst
      - median:
          window_size: 15
          send_every: 15
      - multiply: 2.10
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "Intercom Battery Level"
    id: batt_percentage
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      float v = id(batt_voltage).state;
      if (isnan(v)) return {};
      // 4.2V = 100%, 3.1V = 0%
      float pct = (v - 3.1) / (4.2 - 3.1) * 100.0;
      if (pct > 100.0) pct = 100.0;
      if (pct < 0.0) pct = 0.0;
      return pct;

button:
  - platform: template
    name: "Open Door"
    id: btn_open
    icon: "mdi:door-open"
    on_press:
      - script.execute: manual_open_sequence

  - platform: template
    name: "Cancel Call"
    id: btn_cancel
    icon: "mdi:phone-hangup"
    on_press:
      - script.execute: manual_cancel_sequence

script:
  - id: physical_open_sequence
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: door_unlocked_sensor
          state: ON
      - output.turn_on: out_hook
      - delay: 1000ms
      - output.turn_on: out_unlock
      - delay: 1200ms
      - output.turn_off: out_unlock
      - delay: 500ms
      - output.turn_off: out_hook
      - delay: 500ms
      - binary_sensor.template.publish:
          id: door_unlocked_sensor
          state: OFF

  - id: manual_open_sequence
    mode: restart
    then:
      - script.execute: physical_open_sequence
      - script.wait: physical_open_sequence
      - binary_sensor.template.publish:
          id: call_sensor
          state: OFF
      - delay: 300ms
      - deep_sleep.enter: sleep_module

  - id: manual_cancel_sequence
    mode: restart
    then:
      - logger.log:
          format: ">>> Call cancelled by user. Rejecting and going to sleep..."
          tag: "INTERCOM"
          level: INFO
      - output.turn_on: out_hook
      - delay: 600ms
      - output.turn_off: out_hook
      - binary_sensor.template.publish:
          id: call_sensor
          state: OFF
      - delay: 300ms
      - deep_sleep.enter: sleep_module